<rect x="402" y="90.39999999999999" width="190" height="150" rx="10" fill="#fbe9ec" stroke="#d5dbe3"/>
<text x="497.0" y="114.39999999999999" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Encoder</text>
<text x="497.0" y="136.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">transformer, 4 layers</text>
<text x="497.0" y="153.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle"></text>
<text x="497.0" y="170.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">all 87 tokens look at</text>
<text x="497.0" y="187.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">each other: which</text>
<text x="497.0" y="204.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">matter, and how they</text>
<text x="497.0" y="221.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">go together</text>
<line x1="594" y1="165.39999999999998" x2="622" y2="165.39999999999998" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="624" y="90.39999999999999" width="190" height="150" rx="10" fill="#fbe9ec" stroke="#d5dbe3"/>
<text x="719.0" y="114.39999999999999" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Decoder</text>
<text x="719.0" y="136.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">transformer, 4 layers</text>
<text x="719.0" y="153.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle"></text>
<text x="719.0" y="170.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">10 learned questions,</text>
<text x="719.0" y="187.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">one per coming tick:</text>
<text x="719.0" y="204.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">"what should the arm</text>
<text x="719.0" y="221.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">do then?"</text>
<line x1="816" y1="165.39999999999998" x2="840" y2="165.39999999999998" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="842" y="90.39999999999999" width="150" height="150" rx="10" fill="#eaf1fb" stroke="#d5dbe3"/>
<text x="917.0" y="114.39999999999999" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Out</text>
<text x="917.0" y="136.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">for each of the</text>
<text x="917.0" y="153.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">next 10 ticks (1 s):</text>
<text x="917.0" y="170.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle"></text>
<text x="917.0" y="187.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">6 joint targets</text>
<text x="917.0" y="204.39999999999998" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2733" font-weight="normal" text-anchor="middle">+ finished?</text>
<rect x="402" y="380" width="412" height="72" rx="10" fill="#f6f8fb" stroke="#d5dbe3" stroke-dasharray="6,4"/>
<text x="608.0" y="404" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="bold" text-anchor="middle">Only while training: the style encoder (the "CVAE" part)</text>
<text x="608.0" y="426.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2733" font-weight="normal" text-anchor="middle">sees the expert's real next 10 ticks and sums up their style in z;</text>
<text x="608.0" y="442.5" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2733" font-weight="normal" text-anchor="middle">a penalty keeps z near 0, so pouring with z = 0 is the usual style</text>
<path d="M500,378 L500,248.39999999999998" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<text x="8" y="485" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5b6675" font-weight="normal" text-anchor="start">Inputs, then each picture is turned into tokens: one small summary per place in the picture.</text>
<text x="780" y="485" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5b6675" font-weight="normal" text-anchor="start">10.9 M weights (10.0 M trained)</text>
