<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs>
<rect width="1000" height="150" rx="10" fill="#ffffff"/>
<rect x="8" y="14" width="180" height="120" rx="10" fill="#eaf1fb" stroke="#d5dbe3"/>
<text x="98.0" y="42" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="middle">In</text>
<text x="98.0" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">3 pictures, 0.1 s apart</text>
<text x="98.0" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">48 x 192 each, colour</text>
<text x="98.0" y="106" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">(9 layers stacked)</text>
<line x1="190" y1="74" x2="206" y2="74" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="206" y="14" width="180" height="120" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<text x="296.0" y="42" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="middle">4 blocks</text>
<text x="296.0" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">each: two 3x3 filters,</text>
<text x="296.0" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">then halve the picture</text>
<text x="296.0" y="106" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">32, 64, 96, 128 filters</text>
<line x1="388" y1="74" x2="404" y2="74" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="406" y="14" width="180" height="120" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<text x="496.0" y="42" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="middle">Keep the height</text>
<text x="496.0" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">average across the width:</text>
<text x="496.0" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">12 rows left, each about</text>
<text x="496.0" y="106" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">2 cm of tube</text>
<line x1="588" y1="74" x2="604" y2="74" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="606" y="14" width="180" height="120" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<text x="696.0" y="42" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="middle">2 layers</text>
<text x="696.0" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">1,536 numbers</text>
<text x="696.0" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">-&gt; 256 -&gt; 3</text>
<line x1="788" y1="74" x2="804" y2="74" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="806" y="14" width="180" height="120" rx="10" fill="#eaf1fb" stroke="#d5dbe3"/>
<text x="896.0" y="42" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="middle">Out</text>
<text x="896.0" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">level (%)</text>
<text x="896.0" y="88" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">flow (% per second)</text>
<text x="896.0" y="106" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="middle">balls in the air (%)</text>
</svg>