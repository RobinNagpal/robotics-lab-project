<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs><rect width="1000" height="210" rx="10" fill="#ffffff"/><rect x="16" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="42" cy="44" r="15" fill="#2f5fa8"/><text x="42" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="66" y="50" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2733" font-weight="bold" text-anchor="start">From above</text><text x="32" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">IDEA</text><text x="32" y="105" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Grasp from the top</text><text x="32" y="139" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">PROBLEM</text><text x="32" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Works well, but the gripper</text><text x="32" y="177" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">covers the tube's opening</text><line x1="244" y1="105" x2="261" y2="105" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="265" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="291" cy="44" r="15" fill="#2f5fa8"/><text x="291" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="315" y="50" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2733" font-weight="bold" text-anchor="start">From the side</text><text x="281" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">IDEA</text><text x="281" y="105" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Fingers come in sideways</text><text x="281" y="139" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">PROBLEM</text><text x="281" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Opening free, but wide fingers</text><text x="281" y="177" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">and a fixed angle get blocked</text><line x1="493" y1="105" x2="510" y2="105" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="514" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="540" cy="44" r="15" fill="#2f5fa8"/><text x="540" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="564" y="50" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2733" font-weight="bold" text-anchor="start">Side, version 2</text><text x="530" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">IDEA</text><text x="530" y="105" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Narrow fingers, rack angle</text><text x="530" y="139" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">PROBLEM</text><text x="530" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">More tubes, but tall tubes</text><text x="530" y="177" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">cannot be carried</text><line x1="742" y1="105" x2="759" y2="105" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="763" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="789" cy="44" r="15" fill="#2f5fa8"/><text x="789" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="813" y="50" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2733" font-weight="bold" text-anchor="start">Side, version 3</text><text x="779" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">IDEA</text><text x="779" y="105" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Grip height + plan the carry</text><text x="779" y="139" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">PROBLEM</text><text x="779" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">Large tubes work; tubes can</text><text x="779" y="177" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="start">slip, small tubes unsolved</text></svg>