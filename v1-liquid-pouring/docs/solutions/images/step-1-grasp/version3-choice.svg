<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 168" width="990" height="168"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs><rect width="990" height="168" rx="10" fill="#ffffff"/><rect x="14" y="20" width="176" height="84" rx="9" fill="#f6f8fb" stroke="#2f5fa8" stroke-width="1.5"/><text x="102" y="56" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Close-up depth picture</text><text x="102" y="78" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle"></text><line x1="192" y1="62" x2="207" y2="62" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="208" y="20" width="176" height="84" rx="9" fill="#f6f8fb" stroke="#2f5fa8" stroke-width="1.5"/><text x="296" y="56" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Network scores</text><text x="296" y="78" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle">24 directions × 3 heights</text><line x1="386" y1="62" x2="401" y2="62" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="402" y="20" width="176" height="84" rx="9" fill="#f6f8fb" stroke="#2f5fa8" stroke-width="1.5"/><text x="490" y="56" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="middle">Try the best options</text><text x="490" y="78" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle">highest grip first</text><line x1="580" y1="62" x2="595" y2="62" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="596" y="20" width="176" height="84" rx="9" fill="#f6f8fb" stroke="#2f5fa8" stroke-width="1.5"/><text x="684" y="56" font-family="Helvetica,Arial,sans-serif" font-