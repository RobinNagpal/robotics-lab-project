<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs><rect width="680" height="305" rx="10" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2733" font-weight="bold" text-anchor="start">Why a small tube is hard from the side</text><rect x="20" y="280" width="640" height="10" fill="#c9d1da"/><rect x="150" y="220" width="320" height="10" fill="#6c8ebf"/><rect x="229" y="180" width="22" height="100" rx="3" fill="#a9bccb" stroke="#6f8496"/><rect x="309" y="80" width="22" height="200" rx="3" fill="#a9bccb" stroke="#6f8496"/><rect x="389" y="130" width="22" height="150" rx="3" fill="#a9bccb" stroke="#6f8496"/><text x="240" y="168" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5b6675" font-weight="normal" text-anchor="middle">small</text><text x="400" y="118" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5b6675" font-weight="normal" text-anchor="middle">medium</text><text x="320" y="68" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5b6675" font-weight="normal" text-anchor="middle">large</text><rect x="60" y="188" width="160" height="24" rx="6" fill="#1f2733"/><rect x="20" y="170" width="70" height="60" rx="12" fill="#3a4656"/><text x="120" y="142" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b02a30" font-weight="bold" text-anchor="middle">fingers only about 8 cm up:</text><text x="120" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b02a30" font-weight="bold" text-anchor="middle">wrist must come down too</text><text x="560" y="130" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle">Only about 4 cm of a</text><text x="560" y="148" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle">small tube shows above</text><text x="560" y="166" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#5b6675" font-weight="normal" text-anchor="middle">its rack</text></svg>