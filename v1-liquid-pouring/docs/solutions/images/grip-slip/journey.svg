<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs><rect width="1000" height="412" rx="10" fill="#ffffff"/><rect x="16" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="42" cy="44" r="15" fill="#2f5fa8"/><text x="42" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="66" y="50" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Pour on the real arms</text><text x="32" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="32" y="100" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Tilt the full tube over</text><text x="32" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">the receiver</text><text x="32" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="32" y="160" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Tube slipped on all</text><text x="32" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">6 scenes</text><line x1="244" y1="105.0" x2="261" y2="105.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="265" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="291" cy="44" r="15" fill="#2f5fa8"/><text x="291" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="315" y="50" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Easy guesses</text><text x="281" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="281" y="100" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Slower, tighter, grip</text><text x="281" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">against twisting</text><text x="281" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="281" y="160" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">0 of 6 held. Speed and</text><text x="281" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">squeeze are not the cause</text><line x1="493" y1="105.0" x2="510" y2="105.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="514" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="540" cy="44" r="15" fill="#2f5fa8"/><text x="540" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="564" y="50" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Measure the force</text><text x="530" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="530" y="100" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Force limits of 10, 20</text><text x="530" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">and 40 N</text><text x="530" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="530" y="160" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">All identical: a bad test!</text><text x="530" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Pads really press only 3 N</text><line x1="742" y1="105.0" x2="759" y2="105.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="763" y="16" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="789" cy="44" r="15" fill="#2f5fa8"/><text x="789" y="49" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="813" y="50" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Grip somewhere else</text><text x="779" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="779" y="100" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Hold 5 cm below the rim</text><text x="779" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">instead of 3 cm</text><text x="779" y="142" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="779" y="160" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">2 of 4 held. Slipped later,</text><text x="779" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">so position helps a bit</text><rect x="16" y="218" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="42" cy="246" r="15" fill="#2f5fa8"/><text x="42" y="251" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="66" y="252" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Rule out the rest</text><text x="32" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="32" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Glue the tube to the</text><text x="32" y="320" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">fingers, for a test only</text><text x="32" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="32" y="362" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">12 of 12 pours worked.</text><text x="32" y="380" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Only the grip is wrong</text><line x1="244" y1="307.0" x2="261" y2="307.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="265" y="218" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="291" cy="246" r="15" fill="#2f5fa8"/><text x="291" y="251" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="315" y="252" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Simple settings</text><text x="281" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="281" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Stiffer spring, and pad</text><text x="281" y="320" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">friction 1.2 and 2.0</text><text x="281" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="281" y="362" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Spring 0 of 6. Friction</text><text x="281" y="380" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">5 of 6, and 2.0 is no better</text><line x1="493" y1="307.0" x2="510" y2="307.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="514" y="218" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="540" cy="246" r="15" fill="#2f5fa8"/><text x="540" y="251" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="564" y="252" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">New scenes</text><text x="530" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="530" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">The whole task on 20</text><text x="530" y="320" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">scenes never used before</text><text x="530" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="530" y="362" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">54 of 60, no tube lost.</text><text x="530" y="380" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">But a new failure shows up</text><line x1="742" y1="307.0" x2="759" y2="307.0" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/><rect x="763" y="218" width="225" height="178" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/><circle cx="789" cy="246" r="15" fill="#2f5fa8"/><text x="789" y="251" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">8</text><text x="813" y="252" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2733" font-weight="bold" text-anchor="start">Ask why</text><text x="779" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">WE TRIED</text><text x="779" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Tiny friction changes, and</text><text x="779" y="320" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">measure each touch point</text><text x="779" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b02a30" font-weight="bold" text-anchor="start">WE SAW</text><text x="779" y="362" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">New failure is a near miss.</text><text x="779" y="380" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Slip starts near 0.6 N</text><path d="M875.5,196 V206 H128.5 V215" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/></svg>