<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390"><defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7 z" fill="#b02a30"/></marker></defs><rect width="1000" height="390" rx="10" fill="#ffffff"/><text x="170" y="28" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2733" font-weight="bold" text-anchor="middle">Upright</text><g transform="translate(170,92) rotate(0)"><rect x="-15" y="-36" width="30" height="180" rx="4" fill="#e9f0f7" stroke="#5b6675" stroke-width="1.5"/><path d="M-15,144 h30" stroke="#5b6675" stroke-width="0"/><rect x="-13" y="46" width="26" height="96" rx="3" fill="#7fa9dc"/><rect x="-27" y="-13" width="12" height="26" rx="2" fill="#1f2733"/><rect x="15" y="-13" width="12" height="26" rx="2" fill="#1f2733"/></g><circle cx="170.0" cy="184.0" r="5" fill="#b02a30"/><line x1="170.0" y1="184.0" x2="170.0" y2="236.0" stroke="#b02a30" stroke-width="3" marker-end="url(#ar2)"/><text x="158.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b02a30" font-weight="bold" text-anchor="end">weight</text><text x="170" y="318" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">The weight pulls along the tube.</text><text x="170" y="338" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">Both pads share the load.</text><text x="470" y="28" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2733" font-weight="bold" text-anchor="middle">Half way</text><g transform="translate(470,92) rotate(-45)"><rect x="-15" y="-36" width="30" height="180" rx="4" fill="#e9f0f7" stroke="#5b6675" stroke-width="1.5"/><path d="M-15,144 h30" stroke="#5b6675" stroke-width="0"/><rect x="-13" y="46" width="26" height="96" rx="3" fill="#7fa9dc"/><rect x="-27" y="-13" width="12" height="26" rx="2" fill="#1f2733"/><rect x="15" y="-13" width="12" height="26" rx="2" fill="#1f2733"/></g><circle cx="535.1" cy="157.1" r="5" fill="#b02a30"/><line x1="535.1" y1="157.1" x2="535.1" y2="209.1" stroke="#b02a30" stroke-width="3" marker-end="url(#ar2)"/><text x="523.0538238691623" y="197.0538238691624" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b02a30" font-weight="bold" text-anchor="end">weight</text><text x="470" y="318" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">The weight starts to pull</text><text x="470" y="338" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">across the pads.</text><text x="740" y="28" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2733" font-weight="bold" text-anchor="middle">Lying flat</text><g transform="translate(740,92) rotate(-90)"><rect x="-15" y="-36" width="30" height="180" rx="4" fill="#e9f0f7" stroke="#5b6675" stroke-width="1.5"/><path d="M-15,144 h30" stroke="#5b6675" stroke-width="0"/><rect x="-13" y="46" width="26" height="96" rx="3" fill="#7fa9dc"/><rect x="-27" y="-13" width="12" height="26" rx="2" fill="#1f2733"/><rect x="15" y="-13" width="12" height="26" rx="2" fill="#1f2733"/></g><circle cx="832.0" cy="92.0" r="5" fill="#b02a30"/><line x1="832.0" y1="92.0" x2="832.0" y2="144.0" stroke="#b02a30" stroke-width="3" marker-end="url(#ar2)"/><text x="820.0" y="132.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b02a30" font-weight="bold" text-anchor="end">weight</text><text x="740" y="318" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">One pad is on top, one underneath.</text><text x="740" y="338" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">The weight pulls away from the top pad,</text><text x="740" y="358" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="normal" text-anchor="middle">and it sits far out from the grip.</text></svg>