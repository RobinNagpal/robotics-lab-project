<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6675"/></marker></defs>
<rect width="1000" height="240" rx="10" fill="#ffffff"/>
<rect x="8" y="14" width="180" height="212" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<circle cx="32" cy="40" r="14" fill="#2f5fa8"/>
<text x="32" y="45" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="54" y="46" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="start">What changes</text>
<text x="20" y="78" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2f5fa8" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="20" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Can a model move</text>
<text x="20" y="113" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">the arm, not just</text>
<text x="20" y="130" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">read the level?</text>
<text x="20" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">FOUND</text>
<text x="20" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">Movement learned too:</text>
<text x="20" y="193" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">cameras in, joint</text>
<text x="20" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">targets out</text>
<line x1="190" y1="114" x2="204" y2="114" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="206" y="14" width="180" height="212" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<circle cx="230" cy="40" r="14" fill="#2f5fa8"/>
<text x="230" y="45" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="252" y="46" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="start">What it sees</text>
<text x="218" y="78" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2f5fa8" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="218" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">What does the policy</text>
<text x="218" y="113" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">need to see?</text>
<text x="218" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">FOUND</text>
<text x="218" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">Receiver strip, whole</text>
<text x="218" y="193" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">pour picture, wrist</text>
<text x="218" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">camera, joints, target</text>
<line x1="388" y1="114" x2="402" y2="114" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="404" y="14" width="180" height="212" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<circle cx="428" cy="40" r="14" fill="#2f5fa8"/>
<text x="428" y="45" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="450" y="46" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="start">Demonstrations</text>
<text x="416" y="78" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2f5fa8" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="416" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">What does it copy?</text>
<text x="416" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">FOUND</text>
<text x="416" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">227 programmed pours;</text>
<text x="416" y="193" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">half nudged, to show</text>
<text x="416" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">getting back on course</text>
<line x1="586" y1="114" x2="600" y2="114" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="602" y="14" width="180" height="212" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<circle cx="626" cy="40" r="14" fill="#2f5fa8"/>
<text x="626" y="45" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<text x="648" y="46" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2733" font-weight="bold" text-anchor="start">Two policies</text>
<text x="614" y="78" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2f5fa8" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="614" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Which kind of model?</text>
<text x="614" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">FOUND</text>
<text x="614" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">ACT (transformer) and</text>
<text x="614" y="193" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">a CNN + MLP, same eyes,</text>
<text x="614" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">same data, 30 min each</text>
<line x1="784" y1="114" x2="798" y2="114" stroke="#5b6675" stroke-width="2" marker-end="url(#ar)"/>
<rect x="800" y="14" width="180" height="212" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
<circle cx="824" cy="40" r="14" fill="#2f5fa8"/>
<text x="824" y="45" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">5</text>
<text x="846" y="46" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="bold" text-anchor="start">How well they copy</text>
<text x="812" y="78" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2f5fa8" font-weight="bold" text-anchor="start">QUESTION</text>
<text x="812" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">Do they do what the</text>
<text x="812" y="113" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2733" font-weight="normal" text-anchor="start">expert would do?</text>
<text x="812" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1e7a4c" font-weight="bold" text-anchor="start">FOUND</text>
<text x="812" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">Both within ~0.1 deg</text>
<text x="812" y="193" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">a tick; ACT better at</text>
<text x="812" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2733" font-weight="normal" text-anchor="start">tipping back, stopping</text>
</svg>
