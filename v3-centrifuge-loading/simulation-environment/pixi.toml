[workspace]
name = "centrifuge-loading-sim"
version = "0.1.0"
description = "The MuJoCo lab scene for the centrifuge loading task: a UR5e, a benchtop centrifuge, a balance, 50 ml tubes and liquid made of small balls"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.0,<2.3"
# Reads the meshes and writes the OBJ files MuJoCo loads.
trimesh = ">=4.0"
# Saves the rendered pictures.
pillow = ">=10"
pytest = "*"
ruff = "*"

[pypi-dependencies]
# Below 4.0: MuJoCo 4.0 (Nov 2026) changed parts of the API this code uses.
mujoco = ">=3.3,<4"
# Cuts the six tube holes out of the rotor (a mesh boolean, for looks only).
manifold3d = ">=2.5"
# Google's SDK for Gemini Robotics-ER 2 (Step 0 and later steps).
google-genai = ">=1.0"

# Step 0's comparison with Meta's SAM 3 (through Hugging Face Transformers, which runs without an NVIDIA GPU).
# A separate environment so the simulation's stays small: `pixi run -e sam ...`.
# PyTorch from conda-forge, not pip: pip's wheel brings its own copy of OpenMP, which clashes with NumPy's.
[feature.sam.dependencies]
pytorch = ">=2.7"
torchvision = "*"

[feature.sam.pypi-dependencies]
transformers = ">=4.57"
accelerate = "*"

[environments]
default = []
sam = ["sam"]
