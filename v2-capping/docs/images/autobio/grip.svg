<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Why a grip holds a twist: squeeze times friction</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#eb6834"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2a78d6"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a7972"/></marker>
  </defs>
  <style>
    .surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .tube { fill: #dbe8f5; stroke: #7a7972; stroke-width: 2; } .pad { fill: #3a3a38; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .tube { fill: #26384d; stroke: #9d9c94; } .pad { fill: #8a8983; }
    }
  </style>
  <rect class="surface" x="0" y="0" width="720" height="300" rx="8"/>
  <text class="ink" x="20" y="28" font-size="16" font-weight="600">Seen from above: two fingers squeezing the tube</text>
  <circle class="tube" cx="200" cy="160" r="60"/>
  <text class="ink2" x="200" y="164" font-size="12" text-anchor="middle">tube</text>
  <rect class="pad" x="118" y="120" width="20" height="80" rx="3"/>
  <rect class="pad" x="262" y="120" width="20" height="80" rx="3"/>
  <!-- squeeze -->
  <line x1="60" y1="160" x2="112" y2="160" stroke="#2a78d6" stroke-width="3" marker-end="url(#b)"/>
  <line x1="340" y1="160" x2="288" y2="160" stroke="#2a78d6" stroke-width="3" marker-end="url(#b)"/>
  <text class="ink" x="40" y="148" font-size="13">squeeze</text>
  <text class="ink" x="300" y="148" font-size="13">squeeze</text>
  <!-- twist from the cap -->
  <path d="M 135 92 A 92 92 0 0 1 265 92" fill="none" stroke="#7a7972" stroke-width="2.5" marker-end="url(#c)"/>
  <text class="ink2" x="200" y="52" font-size="13" text-anchor="middle">twist from turning the cap</text>
  <!-- friction pushes back -->
  <line x1="148" y1="134" x2="148" y2="180" stroke="#eb6834" stroke-width="3" marker-end="url(#a)"/>
  <line x1="252" y1="186" x2="252" y2="140" stroke="#eb6834" stroke-width="3" marker-end="url(#a)"/>
  <text class="ink" x="200" y="252" font-size="13" text-anchor="middle">friction at the pads pushes back</text>
  <!-- the rule -->
  <text class="ink" x="400" y="110" font-size="15" font-weight="600">The grip holds until the twist</text>
  <text class="ink" x="400" y="130" font-size="15" font-weight="600">is bigger than the friction:</text>
  <text class="ink" x="400" y="166" font-size="15">twist held ≈ friction × squeeze × radius</text>
  <text class="ink2" x="400" y="200" font-size="13">AutoBio's tube: 1 × 28 N × 14 mm, about 0.33 N m</text>
  <text class="ink2" x="400" y="222" font-size="13">(measured 0.29 to 0.35 N m)</text>
  <text class="ink2" x="400" y="252" font-size="13">Our cap needs 0.6 N m: so about 48 N of squeeze</text>
  <text class="ink2" x="400" y="272" font-size="13">on our 25 mm tube with our pads</text>
</svg>
